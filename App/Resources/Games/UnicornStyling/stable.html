<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; script-src file:; style-src file: 'unsafe-inline';">
  <title>Unicorn Stable</title>
  <link rel="stylesheet" href="stable.css">
  <script src="stable.js" defer></script>
</head>
<body>
  <main id="unicorn-stable" aria-label="Unicorn Stable">
    <div class="stable-game">
      <div class="stable-stage">
        <img class="stable-setting" alt="">
        <div class="stable-sign"><strong></strong><small aria-live="polite"></small></div>
        <div class="stable-pony" aria-label="Painted palomino unicorn">
          <div class="stable-shadow"></div>
          <img class="stable-art" alt="A four-hooved pony with a copper mane and a gold horn">
          <canvas aria-hidden="true"></canvas>
          <div class="stable-pad" hidden></div>
          <img class="stable-saddle" alt="" hidden>
          <img class="stable-ribbon" alt="" hidden>
          <img class="stable-braid" alt="" hidden>
          <img class="stable-braid second-braid" alt="" hidden>
          <div class="pad-motif" aria-hidden="true" hidden></div>
          <div class="stable-effect" aria-hidden="true"></div>
          <div class="stable-targets"></div>
          <img class="stable-brush" alt="" hidden>
        </div>
        <div class="stable-hoof" aria-label="Lifted hoof" hidden>
          <div class="hoof-sole"><div class="hoof-frog"></div></div>
          <div class="hoof-chips"></div>
        </div>
      </div>
      <div class="stable-controls">
        <div class="stable-stations" aria-label="Care stations"></div>
        <div class="stable-tools" aria-label="Stable tools"></div>
        <div class="stable-colors" aria-label="Color choices" hidden></div>
        <div class="stable-hint" aria-live="polite"></div>
      </div>
    </div>
  </main>
</body>
</html>
