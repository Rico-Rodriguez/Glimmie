name: Build iPad app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  my-pages:
    name: My coloring pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Pages already built from unchanged files come back from the cache.
      - uses: actions/cache@v4
        with:
          path: |
            App/Resources/Games/Coloring/my_*.png
            App/Resources/Games/Coloring/mypages.json
          key: mypages-${{ hashFiles('art/coloring/mine/**', 'tools/build_my_pages.py', 'tools/import_coloring.py') }}
          restore-keys: mypages-
      - run: pip install cairosvg pillow numpy scipy
      - name: Build pages from art/coloring/mine
        run: python3 tools/build_my_pages.py
      - uses: actions/upload-artifact@v5
        with:
          name: my-pages
          path: |
            App/Resources/Games/Coloring/my_*.png
            App/Resources/Games/Coloring/mypages.json
          if-no-files-found: error
          retention-days: 3

  ipa:
    name: Unsigned .ipa
    needs: my-pages
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: my-pages
          path: App/Resources/Games/Coloring

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Glimmie.xcodeproj \
            -scheme Glimmie \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build | tee build.log | grep -E "error:|warning: .*Glimmie|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Glimmie.app

      - name: Package Glimmie.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Glimmie.app Payload/
          zip -qry Glimmie.ipa Payload
          ls -lh Glimmie.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: Glimmie-ipa
          path: Glimmie.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: build-log
          path: build.log

  tests:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen && xcodegen generate
      - name: Run unit tests on an iPad simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) for x in d[k] if 'iPad' in x['name']))")
          xcodebuild test -project Glimmie.xcodeproj -scheme Glimmie -configuration Debug \
            -destination "id=$UDID" -derivedDataPath testbuild CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Case .*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-log
          path: test.log

  publish:
    name: Publish release + Feather source
    needs: [ipa, tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v5
        with:
          name: Glimmie-ipa
      - name: Create GitHub Release with Glimmie.ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="1.0.${{ github.run_number }}"
          gh release create "v$VER" Glimmie.ipa --title "Glimmie $VER" --target "${{ github.sha }}" \
            --notes "Unsigned build $VER. Install with Feather, AltStore or Sideloadly."
      - name: Update source.json on main
        run: |
          VER="1.0.${{ github.run_number }}"
          URL="https://github.com/${{ github.repository }}/releases/download/v$VER/Glimmie.ipa"
          python3 tools/make_source.py "$VER" "${{ github.run_number }}" "$URL" "$(stat -c %s Glimmie.ipa)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Feather source: Glimmie $VER [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
