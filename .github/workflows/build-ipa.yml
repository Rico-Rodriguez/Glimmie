name: Build iPad app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_screenshots:
        description: "Commit simulator screenshots to docs/screenshots on this branch"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ipa:
    name: Unsigned .ipa
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Glimmie.xcodeproj \
            -scheme Glimmie \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build | tee build.log | grep -E "error:|warning: .*Glimmie|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Glimmie.app

      - name: Package Glimmie.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Glimmie.app Payload/
          zip -qry Glimmie.ipa Payload
          ls -lh Glimmie.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: Glimmie-ipa
          path: Glimmie.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: build-log
          path: build.log

  tests:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen && xcodegen generate
      - name: Run unit tests on an iPad simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) for x in d[k] if 'iPad' in x['name']))")
          xcodebuild test -project Glimmie.xcodeproj -scheme Glimmie -configuration Debug \
            -destination "id=$UDID" -derivedDataPath testbuild CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Case .*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-log
          path: test.log

  publish:
    name: Publish release + Feather source
    needs: [ipa, tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v5
        with:
          name: Glimmie-ipa
      - name: Create GitHub Release with Glimmie.ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="1.0.${{ github.run_number }}"
          gh release create "v$VER" Glimmie.ipa --title "Glimmie $VER" --target "${{ github.sha }}" \
            --notes "Unsigned build $VER. Install with Feather, AltStore or Sideloadly."
      - name: Update source.json on main
        run: |
          VER="1.0.${{ github.run_number }}"
          URL="https://github.com/${{ github.repository }}/releases/download/v$VER/Glimmie.ipa"
          python3 tools/make_source.py "$VER" "${{ github.run_number }}" "$URL" "$(stat -c %s Glimmie.ipa)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Feather source: Glimmie $VER [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done

  screenshots:
    name: Simulator screenshots
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Glimmie.xcodeproj -scheme Glimmie -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build | tail -5
      - name: Boot an iPad, install, capture screens
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) for x in d[k] if 'iPad' in x['name']))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=simbuild/Build/Products/Debug-iphonesimulator/Glimmie.app
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot() { name=$1; wait=$2; shift 2; xcrun simctl launch "$UDID" com.glimmie.closet "$@"; sleep "$wait"; xcrun simctl io "$UDID" screenshot "shots/$name.png"; xcrun simctl terminate "$UDID" com.glimmie.closet; }
          shot 1-drawer 6
          shot 2-dressup 6 -game dressup
          shot 3-dressup-random 6 -game dressup -randomLook
          shot 4-dressup-clothes 6 -game dressup -randomLook -tab clothes
          shot 5-dressup-gallery 6 -game dressup -demoGallery
          shot 6-coloring 6 -game coloring
          xcrun simctl shutdown "$UDID"
          PHONE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) for x in d[k] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$PHONE"
          xcrun simctl bootstatus "$PHONE" -b
          xcrun simctl install "$PHONE" "$APP"
          xcrun simctl launch "$PHONE" com.glimmie.closet -game dressup
          sleep 10
          xcrun simctl io "$PHONE" screenshot shots/6-iphone-dressup.png
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: shots
      - name: Commit screenshots (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.commit_screenshots
        run: |
          mkdir -p docs/screenshots
          for f in shots/*.png; do sips -s format jpeg -s formatOptions 70 -Z 1400 "$f" --out "docs/screenshots/$(basename "${f%.png}").jpg" >/dev/null; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update simulator screenshots" || exit 0
          git push origin HEAD:${{ github.ref_name }}
