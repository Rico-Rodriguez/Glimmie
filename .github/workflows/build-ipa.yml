name: Build iPad app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_screenshots:
        description: "Commit simulator screenshots to docs/screenshots on this branch"
        type: boolean
        default: false
      only:
        description: "Only take screenshots whose name starts with this (empty = all)"
        type: string
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  my-pages:
    name: My coloring pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Pages already built from unchanged files come back from the cache.
      - uses: actions/cache@v4
        with:
          path: |
            App/Resources/Games/Coloring/my_*.png
            App/Resources/Games/Coloring/mypages.json
          key: mypages-${{ hashFiles('art/coloring/mine/**', 'tools/build_my_pages.py', 'tools/import_coloring.py') }}
          restore-keys: mypages-
      - run: pip install cairosvg pillow numpy scipy
      - name: Build pages from art/coloring/mine
        run: python3 tools/build_my_pages.py
      - uses: actions/upload-artifact@v5
        with:
          name: my-pages
          path: |
            App/Resources/Games/Coloring/my_*.png
            App/Resources/Games/Coloring/mypages.json
          if-no-files-found: error
          retention-days: 3

  ipa:
    name: Unsigned .ipa
    needs: my-pages
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: my-pages
          path: App/Resources/Games/Coloring

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Glimmie.xcodeproj \
            -scheme Glimmie \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build | tee build.log | grep -E "error:|warning: .*Glimmie|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Glimmie.app

      - name: Package Glimmie.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Glimmie.app Payload/
          zip -qry Glimmie.ipa Payload
          ls -lh Glimmie.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: Glimmie-ipa
          path: Glimmie.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: build-log
          path: build.log

  tests:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen && xcodegen generate
      - name: Run unit tests on an iPad simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) for x in d[k] if 'iPad' in x['name']))")
          xcodebuild test -project Glimmie.xcodeproj -scheme Glimmie -configuration Debug \
            -destination "id=$UDID" -derivedDataPath testbuild CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Case .*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-log
          path: test.log

  publish:
    name: Publish release + Feather source
    needs: [ipa, tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v5
        with:
          name: Glimmie-ipa
      - name: Create GitHub Release with Glimmie.ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="1.0.${{ github.run_number }}"
          gh release create "v$VER" Glimmie.ipa --title "Glimmie $VER" --target "${{ github.sha }}" \
            --notes "Unsigned build $VER. Install with Feather, AltStore or Sideloadly."
      - name: Update source.json on main
        run: |
          VER="1.0.${{ github.run_number }}"
          URL="https://github.com/${{ github.repository }}/releases/download/v$VER/Glimmie.ipa"
          python3 tools/make_source.py "$VER" "${{ github.run_number }}" "$URL" "$(stat -c %s Glimmie.ipa)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Feather source: Glimmie $VER [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done

  screenshots:
    name: Simulator screenshots
    # Slow (~30 min), so it only runs when started by hand from the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    needs: my-pages
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: my-pages
          path: App/Resources/Games/Coloring
      - run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Glimmie.xcodeproj -scheme Glimmie -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build | tee simbuild.log | grep -E -A3 "error:|BUILD (SUCCEEDED|FAILED)"
      - name: Boot an iPad, install, capture screens
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) for x in d[k] if 'iPad' in x['name']))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=simbuild/Build/Products/Debug-iphonesimulator/Glimmie.app
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot() { name=$1; wait=$2; shift 2; if [ -n "$ONLY" ] && [[ "$name" != "$ONLY"* ]]; then return; fi; xcrun simctl launch "$UDID" com.glimmie.closet "$@"; sleep "$wait"; xcrun simctl io "$UDID" screenshot "shots/$name.png"; xcrun simctl terminate "$UDID" com.glimmie.closet; }
          shot 1-drawer 6
          shot 1b-treasure-shop 6 -treasureShop -coinsDemo 30
          shot 2-dressup 6 -game dressup
          shot 3-dressup-random 6 -game dressup -randomLook
          shot 4-dressup-clothes 6 -game dressup -randomLook -tab clothes
          shot 5-dressup-gallery 6 -game dressup -demoGallery
          shot 5b-dressup-stickers 6 -game dressup -randomLook -demoCompanion -demoStudio
          shot 5c-dressup-story 6 -game dressup -randomLook -demoCompanion -demoStory
          shot 5d-dressup-makeup 6 -game dressup -demoMakeup
          shot 5e-dressup-nails 6 -game dressup -demoNails
          shot 7-dressup-pets 6 -game dressup -petDemo dressed
          shot 7b-pets-closet 6 -game dressup -petDemo closet
          shot 7c-pets-picker 6 -game dressup -petDemo pets
          shot 7d-pets-bath 6 -game dressup -petDemo foam
          shot 7e-pets-sleep 6 -game dressup -petDemo sleep
          shot 7f-dressup-companion 6 -game dressup -randomLook -demoCompanion
          shot 7g-pets-salon 6 -game dressup -petDemo salon
          shot 7h-dressup-dance 4 -game dressup -randomLook -demoCompanion -demoDance
          shot 7i-dressup-sets 6 -game dressup -demoCompanion -tab sets
          shot 8-dressup-face 6 -game dressup -randomLook -tab me
          shot 9-battle-theme 6 -game dressup -demoBattle
          shot 10-battle-runway 10 -game dressup -randomLook -demoRunway
          shot 6-coloring 6 -game coloring
          shot coloring-tools 8 -game coloring -coloringDemo
          shot petvet-1-lobby 6 -game petvet
          shot petvet-2-exam 6 -game petvet -vetPatient kitty
          shot petvet-3-bath 4 -game petvet -vetPatient puppy -vetFX
          shot petvet-4-held-tool 6 -game petvet -vetPatient puppy -vetHold sponge
          shot bakery-1-shop 6 -game bakery -bakeryServe
          shot bakery-2-decorate 6 -game bakery -bakeryDecorate cake
          shot bakery-3-mix 6 -game bakery -bakeryStep cupcake 0
          shot bakery-4-frost 6 -game bakery -bakeryStep cupcake 2
          shot bakery-5-icecream 6 -game bakery -bakeryDecorate iceCream
          shot bakery-6-pour-flour 6 -game bakery -bakeryStep cake 0 -bakeryDemo pour
          shot bakery-7-stir 6 -game bakery -bakeryStep cake 0 -bakeryDemo stir
          shot bakery-8-pour-pan 6 -game bakery -bakeryStep cake 1 -bakeryDemo pourpan
          shot bakery-9-baking 6 -game bakery -bakeryStep cake 1 -bakeryDemo bake
          shot bakery-10-spread 6 -game bakery -bakeryStep cake 2 -bakeryDemo spread
          shot bakery-11-pipe 6 -game bakery -bakeryStep cupcake 2 -bakeryDemo pipe
          shot bakery-12-sauce 6 -game bakery -bakeryStep iceCream 2 -bakeryDemo sauce
          shot bakery-13-crack 6 -game bakery -bakeryStep cake 0 -bakeryDemo crack
          shot bakery-14-stars 6 -game bakery -bakeryRated
          shot pizza-1-start 6 -game pizza
          shot pizza-2-knead 6 -game pizza -pizzaDemo knead
          shot pizza-3-stretch 6 -game pizza -pizzaDemo stretch
          shot pizza-4-toss 6 -game pizza -pizzaDemo toss
          shot pizza-5-sauce 6 -game pizza -pizzaDemo sauce
          shot pizza-6-cheese 6 -game pizza -pizzaDemo cheese
          shot pizza-7-toppings 6 -game pizza -pizzaDemo toppings
          shot pizza-8-bake 7 -game pizza -pizzaDemo bake
          shot pizza-9-baked 8 -game pizza -pizzaDemo baked
          shot pizza-10-slice 8 -game pizza -pizzaDemo slice
          shot pizza-11-serve 8 -game pizza -pizzaDemo serve
          shot icecream-1-shop 7 -game icecream
          shot icecream-2-scoop 7 -game icecream -iceDemo scoop
          shot icecream-3-soft 8 -game icecream -iceDemo soft
          shot icecream-4-blend 8 -game icecream -iceDemo blend
          shot icecream-5-pour 10 -game icecream -iceDemo pour
          shot icecream-6-sundae 10 -game icecream -iceDemo sundae
          shot icecream-7-serve 8 -game icecream -iceDemo serve
          shot garden-1-new 6 -game garden
          shot garden-2-full 8 -game garden -gardenDemo
          shot garden-3-water 6 -game garden -gardenDemo -gardenTool can
          shot garden-4-dig 6 -game garden -gardenDemo -gardenTool shovel
          shot garden-5-rain 8 -game garden -gardenDemo -gardenWeather rain
          shot garden-6-night 8 -game garden -gardenDemo -gardenWeather night
          shot garden-7-wind 6 -game garden -gardenDemo -gardenWeather wind
          shot spa-1-new 6 -game spa
          shot spa-2-filling 8 -game spa -spaDemo full
          shot spa-3-bomb 8 -game spa -spaDemo bomb
          shot spa-4-mask 8 -game spa -spaDemo mask
          shot spa-5-wand 8 -game spa -spaDemo wand
          shot spa-6-towel 8 -game spa -spaDemo towel
          shot aquarium-1-tank 7 -game aquarium
          shot aquarium-2-busy 8 -game aquarium -aquaDemo
          shot aquarium-3-feed 6 -game aquarium -aquaDemo -aquaTool food
          shot aquarium-4-sponge 6 -game aquarium -aquaDemo -aquaTool sponge
          shot aquarium-5-net 6 -game aquarium -aquaDemo -aquaTool net
          shot aquarium-6-night 8 -game aquarium -aquaDemo -aquaNight
          shot aquarium-7-fish-tray 6 -game aquarium -aquaTray fish
          shot aquarium-8-decor-tray 6 -game aquarium -aquaTray decor
          shot potion-1-lab 7 -game potionlab
          shot potion-2-mix 8 -game potionlab -potionDemo mix
          shot potion-3-pour 8 -game potionlab -potionDemo pour
          shot potion-4-shake 7 -game potionlab -potionDemo shake
          shot potion-5-stir 8 -game potionlab -potionDemo stir
          shot potion-6-boil 9 -game potionlab -potionDemo boil
          shot potion-7-dip 7 -game potionlab -potionDemo dip
          shot potion-8-unicorn 8 -game potionlab -potionDemo unicorn
          shot potion-9-rare 9 -game potionlab -potionDemo rare
          shot potion-10-night 9 -game potionlab -potionDemo night
          shot potion-11-hint 7 -game potionlab -potionDemo hint
          shot unicorn-1-stable 5 -game unicornstable
          shot unicorn-2-meadow 5 -game unicornstable -unicornMeadow
          xcrun simctl shutdown "$UDID"
          if [ -z "$ONLY" ]; then
            PHONE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) for x in d[k] if x['name'].startswith('iPhone')))")
            xcrun simctl boot "$PHONE"
            xcrun simctl bootstatus "$PHONE" -b
            xcrun simctl install "$PHONE" "$APP"
            xcrun simctl launch "$PHONE" com.glimmie.closet -game dressup
            sleep 10
            xcrun simctl io "$PHONE" screenshot shots/6-iphone-dressup.png
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: shots
      - name: Commit screenshots (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.commit_screenshots
        run: |
          mkdir -p docs/screenshots
          for f in shots/*.png; do sips -s format jpeg -s formatOptions 70 -Z 1400 "$f" --out "docs/screenshots/$(basename "${f%.png}").jpg" >/dev/null; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update simulator screenshots" || exit 0
          git push origin HEAD:${{ github.ref_name }}
