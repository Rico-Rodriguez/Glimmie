name: Build iPad app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_screenshots:
        description: "Commit simulator screenshots to docs/screenshots on this branch"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsigned .ipa
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Glimmie.xcodeproj \
            -scheme Glimmie \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*Glimmie|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Glimmie.app

      - name: Package Glimmie.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Glimmie.app Payload/
          zip -qry Glimmie.ipa Payload
          ls -lh Glimmie.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Glimmie-ipa
          path: Glimmie.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

  screenshots:
    name: Simulator screenshots
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Glimmie.xcodeproj -scheme Glimmie -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build | tail -5
      - name: Boot an iPad, install, capture screens
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) for x in d[k] if 'iPad' in x['name']))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=simbuild/Build/Products/Debug-iphonesimulator/Glimmie.app
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          xcrun simctl launch "$UDID" com.glimmie.closet -resetSave
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/1-avatar-maker.png
          xcrun simctl terminate "$UDID" com.glimmie.closet
          xcrun simctl launch "$UDID" com.glimmie.closet -demoBoutique
          sleep 9
          xcrun simctl io "$UDID" screenshot shots/2-boutique.png
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/3-boutique-wish.png
          xcrun simctl terminate "$UDID" com.glimmie.closet
          xcrun simctl launch "$UDID" com.glimmie.closet -demoEgg
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/4-egg.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
      - name: Commit screenshots (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.commit_screenshots
        run: |
          mkdir -p docs/screenshots
          for f in shots/*.png; do sips -s format jpeg -s formatOptions 70 -Z 1400 "$f" --out "docs/screenshots/$(basename "${f%.png}").jpg" >/dev/null; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update simulator screenshots" || exit 0
          git push origin HEAD:${{ github.ref_name }}
