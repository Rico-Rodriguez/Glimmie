name: Tactile iPad verification
on:
  push:
    branches: [codex/tactile-ipad-qa]
  workflow_dispatch:
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Generate project
        run: |
          command -v xcodegen || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate
      - name: Exercise all four games
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; devices=json.load(sys.stdin)['devices']; print(next(d['udid'] for k in sorted(devices, reverse=True) for d in devices[k] if 'iPad' in d['name'] and '11-inch' in d['name']))")
          xcrun simctl boot "$UDID" || true
          xcodebuild test -project Glimmie.xcodeproj -scheme Glimmie -destination "id=$UDID" -parallel-testing-enabled NO -derivedDataPath testbuild -resultBundlePath QA.xcresult CODE_SIGNING_ALLOWED=NO | tee qa.log | grep -E 'error:|Test Case .*failed|Executed|TEST (SUCCEEDED|FAILED)'
      - name: Collect simulator images
        if: always()
        run: |
          mkdir -p images
          xcrun xcresulttool export attachments --path QA.xcresult --output-path images || true
          python3 - <<'PY'
          import json, pathlib, subprocess
          p=pathlib.Path('images')
          manifest=p/'manifest.json'
          if manifest.exists():
              for record in json.loads(manifest.read_text()):
                  for a in record.get('attachments',[]):
                      src=p/a['exportedFileName']
                      if src.suffix.lower()=='.png':
                          out=p/(a.get('suggestedHumanReadableName',src.stem).split('_')[0]+'.jpg')
                          subprocess.run(['sips','-s','format','jpeg','-Z','1100',str(src),'--out',str(out)],check=True)
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: tactile-qa
          path: |
            qa.log
            images/*.jpg
            images/manifest.json

