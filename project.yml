name: Glimmie
options:
  bundleIdPrefix: com.glimmie
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Glimmie:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/Games
        type: folder
        buildPhase: resources
      - path: App/Resources/Sounds
        buildPhase: resources
      - path: App/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glimmie.closet
        PRODUCT_NAME: Glimmie
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Glimmie
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIRequiresFullScreen: true
        NSPhotoLibraryAddUsageDescription: "Save your pictures to Photos."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  TouchQA:
    type: bundle.ui-testing
    platform: iOS
    sources: [QA]
    dependencies:
      - target: Glimmie
    settings:
      base:
        TEST_TARGET_NAME: Glimmie
        PRODUCT_BUNDLE_IDENTIFIER: com.glimmie.touchqa
        GENERATE_INFOPLIST_FILE: YES
  GlimmieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Glimmie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glimmie.closet.tests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Glimmie.app/Glimmie"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
schemes:
  Glimmie:
    build:
      targets:
        Glimmie: all
        GlimmieTests: [test]
        TouchQA: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GlimmieTests
        - TouchQA
    archive:
      config: Release
